
name: "🐛 Bug"
description: "오류 및 버그 제보"
title: "[FIX] "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: "🐛 버그 설명"
      description: "발생한 문제를 구체적으로 작성해주세요."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ 예상 동작"
      description: "정상적으로 동작했을 때 기대하는 결과"

  - type: textarea
    id: actual
    attributes:
      label: "❌ 실제 동작"
      description: "실제로 발생한 문제"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "📎 스크린샷 / 로그"
      description: "오류 화면이나 콘솔 로그를 첨부해주세요."

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 해결 작업"
      value: |
        - [ ] 원인 파악
        - [ ] 오류 수정
        - [ ] 정상 동작 확인
