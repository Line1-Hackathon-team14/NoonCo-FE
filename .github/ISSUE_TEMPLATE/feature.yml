
name: "✨ Feature"
description: "새로운 기능 개발 및 구현"
title: "[FEAT] "
labels: ["feature"]

body:
  - type: textarea
    id: overview
    attributes:
      label: "📌 작업 개요"
      description: "구현할 기능과 작업 목적을 작성해주세요."
      placeholder: "예: 카메라 촬영 페이지 구현"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업 내용"
      description: "구현할 세부 작업을 체크리스트로 작성해주세요."
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: false

  - type: input
    id: components
    attributes:
      label: "📂 관련 페이지 / 컴포넌트"
      placeholder: "예: CameraPage, useTTS"

  - type: textarea
    id: references
    attributes:
      label: "🔗 참고 자료"
      description: "Figma, PRD, API 명세 등의 링크를 첨부해주세요."

  - type: textarea
    id: notes
    attributes:
      label: "💬 기타 사항"
      description: "추가 고려 사항이나 논의가 필요한 내용을 작성해주세요."
